<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelpMeet · Try it</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap">
<style>
:root{--green:#24513A;--green-dark:#193A29;--green-soft:#E6EFE8;--rose:#8E3F4C;--rose-soft:#F6E8E8;--blush:#F4B6BF;--ink:#231B1B;--muted:#66595A;--line:#E8DFD8;--bg:#FAF6F2;--sand:#F1E9E2;
--shadow:0 10px 28px rgba(35,27,27,.07);--btn:0 8px 18px rgba(36,81,58,.28),inset 0 -4px 0 rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.18)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--green);font-family:'Source Serif 4',Georgia,serif;color:var(--ink);display:flex;flex-direction:column;align-items:center}
a{color:inherit}
.topbar{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;color:#fff}
.logo{font-size:24px;font-weight:700;text-decoration:none;color:#fff}.logo span{color:var(--blush)}
.topbar small{color:#E6EFE8;font-size:15px}
.stage{width:100%;max-width:1100px;display:grid;grid-template-columns:1fr 390px 1fr;gap:32px;align-items:start;padding:8px 24px 40px}
.guide{color:#E6EFE8;font-size:16px}
.guide h2{color:#fff;font-size:24px;font-weight:600;margin:0 0 10px}
.guide ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.guide li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;opacity:.6;transition:all .3s}
.guide li i{font-style:normal;width:26px;height:26px;border-radius:999px;background:rgba(255,255,255,.15);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.guide li.on{opacity:1;background:rgba(255,255,255,.12)}
.guide li.on i{background:var(--blush);color:#5A1E28}
.guide li.done{opacity:.85}
.guide li.done i{background:#CFE0D3;color:var(--green-dark)}
.note{background:rgba(255,255,255,.1);border-radius:20px;padding:16px 18px;line-height:1.5}
.note b{color:#fff}
.restart{margin-top:14px;background:none;border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:10px 18px;font:600 15px 'Source Serif 4',Georgia,serif;cursor:pointer}
.restart:hover{background:rgba(255,255,255,.1)}

.phone{width:390px;height:780px;border-radius:52px;background:var(--bg);padding:12px;box-shadow:0 40px 80px rgba(0,0,0,.35)}
.screen{position:relative;height:100%;border-radius:42px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.bar{background:var(--green);color:#fff;padding:22px 22px 18px;border-radius:0 0 30px 30px;flex-shrink:0}
.bar small{display:block;color:#E6EFE8;font-size:14px}
.bar b{display:block;font-size:24px;font-weight:600;line-height:1.2}
.bar .fm{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--rose-soft);color:var(--rose);margin-bottom:6px}
.body{flex:1;overflow-y:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.photo{height:260px;background-size:cover;background-position:center 35%}
.pad{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
h3{margin:0;font-size:24px;font-weight:700}
.muted{color:var(--muted);font-size:15px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--green-soft);color:var(--green-dark)}
.promptbox{background:var(--bg);border-radius:16px;padding:10px 12px;font-size:16px}
.promptbox span{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border:none;border-radius:999px;background:var(--green);color:#fff;font:600 17px 'Source Serif 4',Georgia,serif;cursor:pointer;box-shadow:var(--btn);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.btn:active{transform:scale(.95)}
.btn.soft{background:var(--sand);color:var(--ink);box-shadow:inset 0 -3px 0 rgba(35,27,27,.07),0 3px 8px rgba(35,27,27,.06)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px}.row>*{flex:1}
.link{background:none;border:none;color:var(--green);font:600 15px 'Source Serif 4',Georgia,serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px;align-self:center}
label{font-size:15px;font-weight:600}
input,textarea,select{width:100%;border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:12px 14px;font:400 16px 'Source Serif 4',Georgia,serif;color:var(--ink)}
textarea{resize:none;min-height:76px}
input:focus,textarea:focus,select:focus{outline:3px solid var(--blush);border-color:var(--green)}
.field{display:flex;flex-direction:column;gap:6px}
.dots{display:flex;gap:5px}.dots span{flex:1;height:4px;border-radius:2px;background:var(--line)}.dots span.on{background:var(--green)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.avatars{position:relative;display:flex;gap:8px;justify-content:center}
.avatars img{width:96px;height:96px;border-radius:999px;object-fit:cover;border:4px solid #fff;box-shadow:0 6px 16px rgba(35,27,27,.15)}
.avatars svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.status{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fff;border-radius:18px;box-shadow:var(--shadow);font-size:16px}
.ok{color:var(--green);font-weight:700}.wait{color:var(--muted)}
.code{font-size:44px;font-weight:700;letter-spacing:.25em;text-align:center}
.codebox{background:var(--green-soft);border-radius:24px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.q{background:var(--green-soft);border-radius:26px;padding:26px 22px;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.q .tag{align-self:flex-start;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;color:var(--green-dark)}
.q p{margin:0;font-size:24px;line-height:1.3;font-weight:600}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:18px;box-shadow:var(--shadow);border:2px solid transparent;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.opt .tick{flex:0 0 26px;height:26px;border-radius:999px;background:#B5A69B;opacity:.4;display:flex;align-items:center;justify-content:center}
.opt.on{background:var(--green-soft);border-color:var(--green)}
.opt.on .tick{background:var(--green);opacity:1}
.opt b{display:block;font-size:16px}.opt em{font-style:normal;font-size:13px;color:var(--muted)}
.opt .from{margin-left:auto;font-size:11px;font-weight:700;color:var(--rose);background:var(--rose-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.toast{position:absolute;left:16px;right:16px;bottom:16px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;font-size:15px;box-shadow:0 10px 24px rgba(0,0,0,.25);animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.friend{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fff;border-radius:16px;box-shadow:var(--shadow);font-size:16px}
@media (max-width:980px){.stage{grid-template-columns:1fr;justify-items:center}.guide{max-width:390px;width:100%}.guide.right{order:3}}
@media (max-width:420px){.phone{width:100%;height:auto;min-height:740px;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0;min-height:740px}.stage{padding:0 0 32px}}
</style>
</head>
<body>
<div class="topbar"><a class="logo" href="./">Help<span>Meet</span></a><small>Demo · nothing here is saved</small></div>

  <aside class="guide">
    <h2>Try HelpMeet</h2>
    <ol id="steps"></ol>
  </aside>
  <div class="phone"><div class="screen" id="app" aria-live="polite"></div></div>
  <aside class="guide right">
    <div class="note" id="note"></div>
    <button class="restart" id="restart">Restart demo</button>
  </aside>
</div>

let S;
function reset() {
  S = { view: 'discover', card: 0, myPrompt: '', myIdea: '', arrived: false, emilyArrived: false, codeShown: false, codeIn: '', qi: 0, keep: null, pick: 0, ended: false, toast: '' };
  render();
}
function go(view) { S.view = view; S.toast = ''; render(); document.getElementById('app').scrollTop = 0; }
function toast(t) { S.toast = t; render(); setTimeout(() => { if (S.toast === t) { S.toast = ''; render(); } }, 2200); }

function stepIndex(v) {
  const map = { discover: 0, match: 0, plan: 1, friend: 2, checkin: 3, prompts: 4, keep: 5, done: 6 };
  return map[v];
}
function renderGuide() {
  const cur = stepIndex(S.view);
  document.getElementById('steps').innerHTML = STEPS.map(([, label], i) =>
    `<li class="${i === cur ? 'on' : i < cur ? 'done' : ''}"><i>${i < cur ? '✓' : i + 1}</i>${label}</li>`).join('');
  document.getElementById('note').innerHTML = NOTES[S.view];
}

    { tag: 'Ask each other', text: 'What song would you put on repeat for a long road trip?' }

  if (S.myPrompt.trim()) qs.splice(1, 0, { tag: "From Joshua's friends", text: esc(S.myPrompt.trim()) });
  return qs;
}

}

        </div>
      </div>
      <div class="row"><button class="btn soft" data-act="pass">Pass</button><button class="btn" data-act="like">Like</button></div>
    </div>`;
  },
  match() {
    return `<div class="bar"><small>New match</small><b>It's a match!</b></div>
    <div class="body"><div class="center pop">
      <div class="avatars"><img src="${IMG.joshua}" alt="Joshua"><img src="${IMG.emily}" alt="Emily">${HEART}</div>
      <h3>You and Emily</h3><p class="muted">Presbyterian · Keller</p>
      <p style="margin:0;font-size:16px;max-width:280px">You both liked each other. Time to plan something simple.</p>
    </div><button class="btn" data-act="toPlan">Plan a date</button></div>`;
  },
  plan() {
    return `<div class="bar"><small>With Emily</small><b>Plan the date</b></div>
    <div class="body">
      <div class="field"><label for="place">Where</label><input id="place" value="Coffee shop downtown"></div>
      <div class="row"><div class="field"><label for="day">Day</label><select id="day"><option>Saturday</option><option>Sunday</option><option>Friday</option></select></div>
      <div class="field"><label for="time">Time</label><select id="time"><option>10:00</option><option>2:00</option><option>7:00</option></select></div></div>
      <p class="muted" style="margin-top:4px">Your friends who'll help prepare:</p>
      <div class="friend"><span>Sarah K.</span><span class="ok">Ready</span></div>
      <div class="friend"><span>Marcus T.</span><span class="ok">Ready</span></div>
      <div class="friend"><span>David R.</span><span class="ok">Ready</span></div>
      <div style="flex:1"></div>
      <button class="btn" data-act="toFriend">Send to Emily and my friends</button>
    </div>`;
  },
  friend() {
    return `<div class="bar"><span class="fm">Friend mode · Sarah</span><b>Help Joshua's date go well</b></div>
    <div class="body">
      <div class="card"><div class="pad" style="flex-direction:row;align-items:center;gap:12px">
        <img src="${IMG.emily}" alt="" style="width:56px;height:56px;border-radius:14px;object-fit:cover">
        <div><b style="font-size:16px">Emily, 27</b><p class="muted">Presbyterian · Keller · Bookworm, baker, bad puns</p></div>
      </div></div>
      <div class="field"><label for="myPrompt">A question for the date</label>
        <textarea id="myPrompt" placeholder="e.g. Ask Joshua about his first road trip">${esc(S.myPrompt)}</textarea></div>
      <div class="field"><label for="myIdea">An idea for right after, nearby</label>
        <input id="myIdea" placeholder="e.g. Ice cream two blocks over" value="${esc(S.myIdea)}"></div>
      <p class="muted">Joshua won't see what you wrote until he and Emily both check in.</p>
      <div style="flex:1"></div>
      <button class="btn" data-act="submitFriend">Send to the date</button>
      <button class="link" data-act="skipFriend">Skip, use the sample questions</button>
    </div>`;
  },
  checkin() {
    const both = S.arrived && S.emilyArrived;
    return `<div class="bar"><small>Saturday · 10:00</small><b>Coffee with Emily</b></div>
    <div class="body">
      <div class="status"><span>You</span>${S.arrived ? '<span class="ok">✓ Arrived</span>' : '<span class="wait">On the way</span>'}</div>
      <div class="status"><span>Emily</span>${S.emilyArrived ? '<span class="ok">✓ Arrived</span>' : '<span class="wait">On the way</span>'}</div>
      ${!S.arrived ? `<div style="flex:1"></div><button class="btn" data-act="arrive">I've arrived</button>` : ''}
      ${S.arrived && !both ? `<p class="muted" style="text-align:center">Waiting for Emily…</p>` : ''}
      ${both ? `<div class="codebox pop"><span class="muted">You're both here. Your code:</span><div class="code">4817</div><span class="muted">The same code is on Emily's phone.</span></div>
        <div class="field"><label for="codeIn">Enter the code to unlock your friends' questions</label>
        <input id="codeIn" inputmode="numeric" maxlength="4" placeholder="4-digit code" value="${esc(S.codeIn)}" style="font-size:22px;letter-spacing:.2em;text-align:center"></div>
        <button class="btn" data-act="unlock">Unlock</button>` : ''}
    </div>`;
  },
  prompts() {
    const qs = questions(); const q = qs[S.qi % qs.length];
    return `<div class="bar"><small>Question ${S.qi % qs.length + 1} of ${qs.length}</small><b>From your friends</b></div>
    <div class="body">
      <div class="q pop" key="${S.qi}"><span class="tag">${q.tag}</span><p>${q.text}</p></div>
      <p class="muted" style="text-align:center">Use any, skip any, or put the phone away.</p>
      <div style="flex:1"></div>
      <div class="row"><button class="btn soft" data-act="nextQ">Skip</button><button class="btn" data-act="nextQ">Next question</button></div>
      <button class="link" data-act="toKeep">Wrapping up? Go to "Keep going?"</button>
    </div>`;
  },
  keep() {
    if (S.keep === null) {
      return `<div class="bar"><small>Just between you and the app</small><b>Having a good time?</b></div>
      <div class="body"><div class="center">
        <div class="avatars"><img src="${IMG.joshua}" alt=""><img src="${IMG.emily}" alt="">${HEART}</div>
        <h3>Want to keep going?</h3><p class="muted" style="max-width:280px">Emily won't see your answer unless you both say yes.</p>
      </div><div class="row"><button class="btn soft" data-act="keepNo">Not today</button><button class="btn" data-act="keepYes">Yes!</button></div></div>`;
    }
    if (S.keep === 'waiting') {
      return `<div class="bar"><small>Keep going?</small><b>Waiting on Emily…</b></div><div class="body"><div class="center"><p class="muted">Emily is answering privately.</p></div></div>`;
    }
    if (S.keep === 'no') {
      return `<div class="bar"><small>Keep going?</small><b>Thanks for meeting!</b></div><div class="body"><div class="center">
        <h3>That's a wrap for today</h3><p class="muted" style="max-width:280px">Emily only sees that the date ended, not who answered what.</p>
      </div><button class="btn" data-act="finish">Finish</button></div>`;
    }
    const list = ideas();
    return `<div class="bar"><small>Keep going?</small><b>You both said yes!</b></div>
    <div class="body">
      <p class="muted">Your friends' picks nearby</p>
      ${list.map((o, i) => `<button class="opt ${S.pick === i ? 'on' : ''}" data-pick="${i}"><span class="tick">${TICK}</span><span><b>${o.name}</b><em>${o.dist}</em></span>${o.mine ? '<span class="from">Your idea</span>' : ''}</button>`).join('')}
      <div style="flex:1"></div>
      <button class="btn" data-act="letsGo">Let's go!</button>
      <button class="link" data-act="ownThing">We'll take it from here!</button>
    </div>`;
  },
  done() {
    const pick = S.ended ? null : ideas()[S.pick];
    return `<div class="bar"><small>Saturday</small><b>${pick ? 'Off you go!' : 'Have fun!'}</b></div>
    <div class="body"><div class="center pop">
      <div class="avatars"><img src="${IMG.joshua}" alt=""><img src="${IMG.emily}" alt="">${HEART}</div>
      <h3>${pick ? 'Headed to: ' + pick.name : 'Enjoy the rest of your date'}</h3>
      <p class="muted" style="max-width:290px">Your friends only learn that the date happened. How it went is yours to tell.</p>
    </div><button class="btn" data-act="restart">Start over</button></div>`;
  }
};

function render() {
  const app = document.getElementById('app');
  app.innerHTML = V[S.view]() + (S.toast ? `<div class="toast">${S.toast}</div>` : '');
  renderGuide();
}

document.getElementById('app').addEventListener('input', (e) => {
  if (e.target.id === 'myPrompt') S.myPrompt = e.target.value;
  if (e.target.id === 'myIdea') S.myIdea = e.target.value;
  if (e.target.id === 'codeIn') S.codeIn = e.target.value.replace(/\D/g, '').slice(0, 4);
});
document.getElementById('app').addEventListener('click', (e) => {
  const pick = e.target.closest('[data-pick]');
  if (pick) { S.pick = +pick.dataset.pick; render(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'pass') return toast("In the real app you'd see the next of your 7. For the demo, give Emily a chance!");
  if (a === 'like') return go('match');
  if (a === 'toPlan') return go('plan');
  if (a === 'toFriend') return go('friend');
  if (a === 'submitFriend' || a === 'skipFriend') return go('checkin');
  if (a === 'arrive') { S.arrived = true; render(); setTimeout(() => { S.emilyArrived = true; render(); }, 1400); return; }
  if (a === 'unlock') { if (S.codeIn !== '4817') return toast('Type the code shown above: 4817'); S.qi = 0; return go('prompts'); }
  if (a === 'nextQ') { S.qi++; render(); return; }
  if (a === 'toKeep') { S.keep = null; return go('keep'); }
  if (a === 'keepYes') { S.keep = 'waiting'; render(); setTimeout(() => { S.keep = 'yes'; S.pick = 0; render(); }, 1300); return; }
  if (a === 'keepNo') { S.keep = 'no'; render(); return; }
  if (a === 'letsGo') { S.ended = false; return go('done'); }
  if (a === 'ownThing' || a === 'finish') { S.ended = true; return go('done'); }
  if (a === 'restart') return reset();
});
document.getElementById('restart').addEventListener('click', reset);
reset();
</script>
</body>
</html>
